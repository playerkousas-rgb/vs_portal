<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重設密碼 · Scout System</title><link rel="stylesheet" href="assets/css/main.css"></head>
<body class="login-body"><main class="login-panel"><div class="login-card" style="max-width:440px;margin:48px auto"><h1>重設密碼</h1><p class="sub">請設定最少 4 位的新密碼。重設後首次登入仍會要求確認密碼。</p><form id="resetForm"><div class="field"><label class="label">新密碼</label><input class="input" id="password" type="password" minlength="4" required autocomplete="new-password"></div><div class="field mt-12"><label class="label">再次輸入</label><input class="input" id="confirm" type="password" minlength="4" required autocomplete="new-password"></div><div id="message" class="err mt-8"></div><button class="btn btn-primary btn-lg btn-block mt-16" type="submit">確認重設密碼</button></form></div></main><script type="module">
const q=new URLSearchParams(location.search), unit=q.get('unit')||'', token=q.get('token')||'', form=document.querySelector('#resetForm'), msg=document.querySelector('#message');
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const password=document.querySelector('#password').value,confirm=document.querySelector('#confirm').value;if(password.length<4){msg.textContent='密碼最少要 4 位';return}if(password!==confirm){msg.textContent='兩次密碼不一致';return}const r=await fetch('./api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'authResetByToken',unit,token,newPassword:password})});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false){msg.textContent=d.error||'連結無效或已過期';return}form.innerHTML='<div class="note-box success">密碼已重設。請返回系統，用新密碼登入。</div>'});
</script></body></html>
