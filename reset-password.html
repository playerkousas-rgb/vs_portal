<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>重設密碼 · Scout System</title>
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/mobile.css">
  <script src="./assets/js/analytics.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="login-body">
  <main class="login-panel">
    <div class="login-card" style="max-width:440px;margin:48px auto">
      <h1>重設密碼</h1>
      <p class="sub">請設定最少 4 位的新密碼。成功後請用新密碼登入。</p>
      <form id="resetForm">
        <div class="field">
          <label class="label">新密碼</label>
          <input class="input" id="password" type="password" minlength="4" required autocomplete="new-password">
        </div>
        <div class="field mt-12">
          <label class="label">再次輸入</label>
          <input class="input" id="confirm" type="password" minlength="4" required autocomplete="new-password">
        </div>
        <div id="message" class="err mt-8"></div>
        <button class="btn btn-primary btn-lg btn-block mt-16" type="submit">確認重設密碼</button>
      </form>
    </div>
  </main>
  <script type="module" src="./assets/js/reset-password.js"></script>
</body>
</html>
